[package]
name = "velocity-ui"
description = "Installer wizard UI for Velocity Installer — modern and classic themes"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
velocity-config = { workspace = true }
velocity-core = { workspace = true }
thiserror = { workspace = true }
anyhow = { workspace = true }
tracing = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
tar = { workspace = true }
zstd = { workspace = true }
lzma-rs = { workspace = true }

# Windows-only dependencies
[target.'cfg(target_os = "windows")'.dependencies]
windows = { workspace = true }
webview2-com = { workspace = true }
winreg = { workspace = true }

# Cross-platform GUI (wry+tao wizard)
[target.'cfg(not(target_os = "windows"))'.dependencies]
wry = { workspace = true }
tao = { workspace = true }
http = "1"

# Linux needs GTK for wry's webkit2gtk backend
[target.'cfg(target_os = "linux")'.dependencies]
gtk = "0.18"
