# Sample Velocity Installer Configuration
#
# This is a realistic example that exercises all major installer features.
# Use it as a starting template for your own application, or as a beta test
# to verify the installer pipeline works end-to-end.
#
# Build:  velocity build
# Test:   installer.exe /S /D=C:\TestInstall
# Uninstall: installer.exe --uninstall --force

[app]
name = "UninstallTest"
version = "2.0.0"
publisher = "Velocity Team"
icon = "assets/icon.ico"
license = "LICENSE.txt"

[install]
default_dir = "{autopf}/SampleApp"
start_menu = "Sample App"
require_admin = false
run_after_install = ""
close_app_before_install = true
verify_checksums = false
arch = "x64"
create_desktop_shortcut = true

# Overwrite behavior
overwrite_mode = "always"

# Reboot handling
reboot_handling = "auto"

# --- Files ---
[files]
source = ["files/bin/*", "files/docs/*", "files/sdk/*", "files/samples/*"]
exclude = ["*.pdb", "*.tmp", "*.log"]

# Compression settings for the installer payload
# Format: "zstd" (fast, recommended) or "lzma2" (smaller, slower)
# Level: 1-22 for zstd, 1-9 for lzma2. Higher = smaller but slower.
# Recommended: 3 for dev builds, 9-15 for release builds.
[files.compression]
format = "zstd"
level = 3

# --- Components (user-selectable) ---
[[components]]
id = "core"
name = "Core Application"
description = "Required application binaries and libraries"
selected_by_default = true
mandatory = true
source = ["./files/bin/**"]

[[components]]
id = "docs"
name = "Documentation"
description = "User manuals and API reference (2.4 MB)"
selected_by_default = true
source = ["./files/docs/**"]

[[components]]
id = "sdk"
name = "Developer SDK"
description = "Headers, libraries, and code samples (8.1 MB)"
selected_by_default = false
source = ["./files/sdk/**"]

[[components]]
id = "samples"
name = "Sample Projects"
description = "Ready-to-run example projects (1.2 MB)"
selected_by_default = false
source = ["./files/samples/**"]

# --- Remote Dependencies ---
[[dependencies]]
name = "VC++ 2022 Redistributable (x64)"
url = "https://aka.ms/vs/17/release/vc_redist.x64.exe"
install_args = "/install /quiet /norestart"
condition = "not_installed:Microsoft Visual C++ 2022 Redistributable (x64)"
required = true
priority = 10

# --- Shortcuts ---
[shortcuts]
desktop = true
start_menu = true
quick_launch = false

# --- Registry ---
[[registry]]
key = "Software\\SampleApp"
name = "InstallPath"
value = "{app}"
root = "HKCU"

[[registry]]
key = "Software\\SampleApp"
name = "Version"
value = "{version}"
root = "HKCU"

[[registry]]
key = "Software\\SampleApp\\Settings"
name = "FirstRun"
value = "1"
root = "HKCU"

# --- Environment Variables ---
[[env_vars]]
name = "SAMPLE_APP_HOME"
value = "{app}"
scope = "user"

[[env_vars]]
name = "SAMPLE_APP_VERSION"
value = "{version}"
scope = "user"

# --- File Associations ---
[[file_associations]]
extension = ".sample"
description = "Sample App Project File"
handler = "sample-app.exe"
icon_index = 1

# --- Scripts ---
[scripts]
pre_install = ["echo Installing Sample App v{version}..."]
post_install = ["echo Sample App v{version} installed successfully!"]

# Structured post-install actions
[[scripts.post_install_actions]]
name = "Create config directory"
action = "mkdir"
path = "{install_dir}\\config"
on_error = "continue"

[[scripts.post_install_actions]]
name = "Write version marker"
action = "copy"
src = "{install_dir}\\bin\\version.txt"
dest = "{install_dir}\\config\\version.txt"
condition = "file_missing:{install_dir}\\config\\version.txt"
on_error = "continue"

# --- Localization ---
[localization]
default_language = "en"

[[localization.languages]]
code = "de"
name = "Deutsch"
[localization.languages.strings]
btn_next = "Weiter (&N) >"
btn_back = "< Zurück (&B)"
btn_install = "Installieren (&I)"
btn_finish = "Fertigstellen (&F)"
btn_cancel = "Abbrechen"
btn_browse = "Durchsuchen..."
page_welcome = "Willkommen"
page_directory = "Installationsverzeichnis"
page_components = "Komponenten auswählen"

[[localization.languages]]
code = "es"
name = "Español"
[localization.languages.strings]
btn_next = "Siguiente (&N) >"
btn_back = "< Atrás (&B)"
btn_install = "Instalar (&I)"
btn_finish = "Finalizar (&F)"
btn_cancel = "Cancelar"
btn_browse = "Examinar..."

[[localization.languages]]
code = "fr"
name = "Français"
[localization.languages.strings]
btn_next = "Suivant (&N) >"
btn_back = "< Retour (&B)"
btn_install = "Installer (&I)"
btn_finish = "Terminer (&F)"
btn_cancel = "Annuler"
btn_browse = "Parcourir..."

[[localization.languages]]
code = "ja"
name = "日本語"
[localization.languages.strings]
btn_next = "次へ (&N) >"
btn_back = "< 戻る (&B)"
btn_install = "インストール (&I)"
